services:
  - type: web
    name: tcsnqt-app
    env: node
    region: singapore
    buildCommand: npm install && cd server && npm install && cd .. && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        value: admin123
      - key: PORT
        value: 5000
